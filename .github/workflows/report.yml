name: Record a speaker report

# Reads a "Speaker report" issue and updates speakers.json and README.md: a speaker that is already
# listed has the report counted, a new one is added. The list is data, not code, so it is committed
# straight to main (this repository builds nothing).
#
# The issue text is written by anyone, so it only reaches the script through environment variables,
# the script validates every field and writes the file with a JSON serializer, and the job runs on a
# GitHub-hosted runner. Needs: Actions allowed to push to main (no rule that blocks github-actions).

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: speakers-write
  cancel-in-progress: false

jobs:
  record:
    if: contains(github.event.issue.labels.*.name, 'speaker-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count this person's reports in the last day
        id: rate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh issue list --author "$AUTHOR" --label speaker-report --state all --search "created:>=$since" --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Record the report
        id: record
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_REPORTS_TODAY: ${{ steps.rate.outputs.count }}
        run: python3 scripts/report.py speakers.json "$RUNNER_TEMP/comment.md"

      - name: Publish the new list
        if: steps.record.outputs.result != 'refused'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speakers.json README.md
          git commit -m "Record a speaker report from issue #${ISSUE_NUMBER}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Answer, and close the issue unless a maintainer should look
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.record.outputs.result }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          case "$RESULT" in
            refused)
              gh issue close "$ISSUE_NUMBER" --reason "not planned" ;;
            counted-review)
              # The report disagrees with an entry a maintainer checked: keep it open, and say so.
              gh label create needs-review --description "A report disagrees with a curated entry" --force
              gh issue edit "$ISSUE_NUMBER" --add-label needs-review ;;
            *)
              gh issue close "$ISSUE_NUMBER" --reason completed ;;
          esac
