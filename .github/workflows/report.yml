name: Record a speaker report

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

# Serialize writes to speakers.json. GitHub keeps up to 100 pending runs.
concurrency:
  group: speakers-write
  queue: max

jobs:
  record:
    # New/reopened Speaker reports run immediately. A label event is accepted only
    # when the speaker-report label is added, so unrelated label changes do nothing.
    if: >-
      startsWith(github.event.issue.title, 'Speaker:')
      && (
        (github.event_name == 'issues' && (github.event.action != 'labeled' || github.event.label.name == 'speaker-report'))
        || (github.event_name == 'issue_comment' && github.event.comment.body == '/process')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prevent processing the same issue twice
        id: idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ariacast-report-processed -->")))] | length')

          echo "already=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Count this author's reports in the last 24 hours
        id: rate
        if: steps.idempotency.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          count=$(gh issue list \
            --author "$AUTHOR" \
            --state all \
            --search "created:>=$since" \
            --limit 1000 \
            --json title \
            --jq '[.[] | select(.title | startswith("Speaker:"))] | length')

          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Validate and record the report
        id: record
        if: steps.idempotency.outputs.already != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTHOR_REPORTS_TODAY: ${{ steps.rate.outputs.count }}
        run: |
          python3 -B scripts/report.py speakers.json "$RUNNER_TEMP/comment.md"

      - name: Commit and push the updated list
        if: steps.idempotency.outputs.already != 'true' && steps.record.outputs.result != 'refused' && steps.record.outputs.result != 'duplicate'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add speakers.json README.md

          if git diff --cached --quiet; then
            echo "No list changes to publish."
            exit 0
          fi

          git commit -m "Record speaker report from issue #${ISSUE_NUMBER}"

          # Rebase the already-created commit on the newest main, then push.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Reply to the report
        if: steps.idempotency.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.record.outputs.result }}
        run: |
          printf '\n\n<!-- ariacast-report-processed -->\n' >> "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

          if [ "$RESULT" = "refused" ]; then
            gh issue close "$ISSUE_NUMBER" --reason "not planned"
          else
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
