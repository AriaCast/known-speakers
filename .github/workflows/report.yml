name: Record a speaker report

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: speakers-write
  queue: max

jobs:
  record:
    # Processa esclusivamente le issue create dal template Speaker report.
    if: startsWith(github.event.issue.title, 'Speaker:')

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Count this person's reports in the last 24 hours
        id: rate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          count=$(gh issue list \
            --author "$AUTHOR" \
            --state all \
            --search "created:>=$since" \
            --limit 1000 \
            --json title \
            --jq '[.[] | select(.title | startswith("Speaker:"))] | length')

          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Record the report
        id: record
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR_REPORTS_TODAY: ${{ steps.rate.outputs.count }}
        run: |
          python3 scripts/report.py \
            speakers.json \
            "$RUNNER_TEMP/comment.md"

      - name: Publish the updated list
        if: steps.record.outputs.result != 'refused'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          git add speakers.json README.md

          git commit \
            -m "Record a speaker report from issue #${ISSUE_NUMBER}"

          git push origin HEAD:main

      - name: Answer and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.record.outputs.result }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body-file "$RUNNER_TEMP/comment.md"

          if [ "$RESULT" = "refused" ]; then
            gh issue close "$ISSUE_NUMBER" --reason "not planned"
          else
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
